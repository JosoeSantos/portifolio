<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>palette · primary</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
      }
      .row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }
      .swatch {
        border: 1px solid var(--rule);
        border-radius: var(--r-2);
        overflow: hidden;
      }
      .chip {
        height: 80px;
      }
      .meta {
        padding: 8px 10px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 6px;
      }
      .name {
        font-family: var(--font-ui);
        font-size: 12px;
        font-weight: 600;
        color: var(--fg);
      }
      .hex {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--fg-3);
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="swatch">
        <div class="chip" style="background: #6a221d"></div>
        <div class="meta">
          <span class="name">deep</span><span class="hex">#6A221D</span>
        </div>
      </div>
      <div class="swatch">
        <div class="chip" style="background: #913832"></div>
        <div class="meta">
          <span class="name">ochre</span><span class="hex">#913832</span>
        </div>
      </div>
      <div class="swatch">
        <div class="chip" style="background: #b85b53"></div>
        <div class="meta">
          <span class="name">tint</span><span class="hex">#B85B53</span>
        </div>
      </div>
      <div class="swatch">
        <div class="chip" style="background: #d18a83"></div>
        <div class="meta">
          <span class="name">soft</span><span class="hex">#D18A83</span>
        </div>
      </div>
      <div class="swatch">
        <div class="chip" style="background: #f5e3df"></div>
        <div class="meta">
          <span class="name">wash</span><span class="hex">#F5E3DF</span>
        </div>
      </div>
    </div>
  </body>
</html>
