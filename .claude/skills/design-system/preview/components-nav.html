<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>nav</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <link rel="stylesheet" href="../grid.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
      }
      .stage {
        padding: 0;
      }
      nav {
        display: flex;
        align-items: center;
        padding: 14px 24px;
        border-bottom: 1px solid var(--rule);
        background: rgba(253, 252, 250, 0.7);
        backdrop-filter: blur(10px) saturate(140%);
        -webkit-backdrop-filter: blur(10px) saturate(140%);
      }
      .brand {
        font-family: var(--font-display);
        font-weight: 600;
        letter-spacing: -0.02em;
        font-size: 16px;
        color: var(--fg);
      }
      .brand .dot {
        color: var(--accent);
      }
      .links {
        display: flex;
        gap: 18px;
        margin-left: 36px;
        flex: 1;
      }
      .links a {
        font-family: var(--font-ui);
        font-size: 14px;
        color: var(--fg-2);
      }
      .links a.active {
        color: var(--accent);
      }
      .util {
        display: flex;
        gap: 14px;
        align-items: center;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--fg-3);
      }
      .panel {
        padding: 28px 24px;
      }
      .h {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 22px;
        color: var(--fg);
        letter-spacing: -0.02em;
      }
      .sub {
        font-family: var(--font-serif);
        font-size: 14px;
        color: var(--fg-2);
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="stage grid-bg">
      <nav>
        <div class="brand">[name]<span class="dot">.</span></div>
        <div class="links">
          <a>essays</a><a class="active">projects</a><a>now</a><a>archive</a>
        </div>
        <div class="util">
          <span>v0.4.2</span><span>·</span><span>ink/paper</span>
        </div>
      </nav>
      <div class="panel">
        <div class="h">projects</div>
        <div class="sub">small things i'm building, with care.</div>
      </div>
    </div>
  </body>
</html>
