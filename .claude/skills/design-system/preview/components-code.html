<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>code block</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
      }
      .caption {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--fg-3);
        margin-bottom: 4px;
        display: flex;
        gap: 8px;
      }
      .caption .file {
        color: var(--accent);
      }
      pre {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 13px;
        line-height: 1.6;
        background: var(--bg-sunken);
        border: 1px solid var(--rule);
        border-radius: var(--r-2);
        padding: 12px 16px;
        color: var(--fg);
      }
      .k {
        color: var(--accent);
      }
      .s {
        color: #4f6b3e;
      }
      .c {
        color: var(--fg-3);
        font-style: italic;
      }
      .n {
        color: var(--fg-2);
      }
    </style>
  </head>
  <body>
    <div class="caption">
      <span class="file">parser.c</span><span>· lines 18–26</span>
    </div>
    <pre><span class="c">// match a quoted string, including escapes</span>
<span class="k">static</span> <span class="n">Token</span> read_string(<span class="n">Lexer</span> *lx) {
  <span class="k">char</span> buf[256]; <span class="k">int</span> i = <span class="n">0</span>;
  <span class="k">while</span> (peek(lx) != <span class="s">'"'</span> &amp;&amp; !at_end(lx)) {
    buf[i++] = read_char(lx);
  }
  <span class="k">return</span> tok(<span class="n">T_STR</span>, buf, i);
}</pre>
  </body>
</html>
