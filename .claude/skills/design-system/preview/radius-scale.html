<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>radius</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        padding: 28px;
        background: var(--bg);
      }
      .row {
        display: flex;
        gap: 24px;
        align-items: flex-end;
      }
      .item {
        text-align: center;
      }
      .box {
        width: 96px;
        height: 96px;
        background: var(--bg-raised);
        border: 1px solid var(--rule);
      }
      .tok {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--fg-3);
        margin-top: 8px;
      }
      .v {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="item">
        <div class="box" style="border-radius: 0"></div>
        <div class="tok">--r-0</div>
        <div class="v">0px</div>
      </div>
      <div class="item">
        <div class="box" style="border-radius: 2px"></div>
        <div class="tok">--r-1</div>
        <div class="v">2px</div>
      </div>
      <div class="item">
        <div class="box" style="border-radius: 4px"></div>
        <div class="tok">--r-2</div>
        <div class="v">4px</div>
      </div>
      <div class="item">
        <div class="box" style="border-radius: 8px"></div>
        <div class="tok">--r-3</div>
        <div class="v">8px</div>
      </div>
    </div>
  </body>
</html>
