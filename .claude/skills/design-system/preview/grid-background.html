<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>grid background</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <link rel="stylesheet" href="../grid.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
      }
      .stage {
        padding: 28px;
        height: 240px;
        box-sizing: border-box;
        position: relative;
      }
      .label {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .heading {
        font-family: var(--font-display);
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--fg);
        margin-top: 8px;
      }
      .sub {
        font-family: var(--font-serif);
        font-size: 14px;
        color: var(--fg-2);
        margin-top: 8px;
        max-width: 40ch;
      }
      .accent {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="stage grid-bg">
      <div class="label">.grid-bg · 32px hairline</div>
      <div class="heading">
        careful, by default<span class="accent">.</span>
      </div>
      <div class="sub">
        the signature promo motif: a 32px architectural grid drawn at 6% warm
        gray. it stays in the background and lets type lead.
      </div>
    </div>
  </body>
</html>
