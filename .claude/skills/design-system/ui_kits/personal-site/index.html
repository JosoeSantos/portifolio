<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>[name] — personal site</title>
    <link rel="icon" href="../../assets/favicon.svg" />
    <link rel="stylesheet" href="../../colors_and_type.css" />
    <link rel="stylesheet" href="../../grid.css" />
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" src="Nav.jsx"></script>
    <script type="text/babel" src="Hero.jsx"></script>
    <script type="text/babel" src="ProjectCard.jsx"></script>
    <script type="text/babel" src="EssayRow.jsx"></script>
    <script type="text/babel" src="NowList.jsx"></script>
    <script type="text/babel" src="Primitives.jsx"></script>
    <script type="text/babel" src="Screens.jsx"></script>

    <script type="text/babel">
      const App = () => {
        const [screen, setScreen] = React.useState("home");
        const [theme, setTheme] = React.useState("paper");
        const [openEssay, setOpenEssay] = React.useState(null);

        React.useEffect(() => {
          document.documentElement.dataset.theme = theme;
        }, [theme]);

        const onNav = (s) => {
          setOpenEssay(null);
          // Map nav labels to screen keys
          const map = {
            home: "home",
            essays: "essays",
            projects: "projects",
            now: "now",
            archive: "archive",
          };
          setScreen(map[s] ?? s);
        };

        const onTheme = () => setTheme(theme === "ink" ? "paper" : "ink");
        const active = screen === "reading" ? "essays" : screen;

        let body;
        if (openEssay) {
          body = (
            <ReadingScreen
              essay={openEssay}
              onBack={() => setOpenEssay(null)}
            />
          );
        } else if (screen === "home") {
          body = <HomeScreen onNav={onNav} />;
        } else if (screen === "essays") {
          body = <EssaysScreen onOpen={(e) => setOpenEssay(e)} />;
        } else if (screen === "projects") {
          body = <ProjectsScreen />;
        } else if (screen === "now") {
          body = <NowScreen />;
        } else if (screen === "archive") {
          body = <ArchiveScreen />;
        } else if (screen === "404") {
          body = <NotFoundScreen onNav={onNav} />;
        } else {
          body = <NotFoundScreen onNav={onNav} />;
        }

        return (
          <div className="ds-app">
            <Nav
              active={active}
              onNav={onNav}
              theme={theme}
              onTheme={onTheme}
            />
            {body}
            <Footer />
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
